<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>BioQuest - FaBiologia</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #071b22;
      overflow: hidden;
      touch-action: none;
    }

    /* o jogo ocupa a tela inteira e o Phaser ajusta o canvas dentro dela */
    #game {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #game canvas {
      display: block;
    }

    /* aviso para girar o celular */
    #girar {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10;
      background: #071b22;
      color: #80efb1;
      font-family: Arial, Helvetica, sans-serif;
      font-weight: bold;
      font-size: 22px;
      text-align: center;
      line-height: 1.5;
      padding: 24px;
      justify-content: center;
      align-items: center;
    }

    @media (orientation: portrait) and (max-width: 900px) {
      #girar { display: flex; }
    }
  </style>
</head>
<body>

  <div id="game"></div>

  <div id="girar">
    Gire o celular para<br>o modo paisagem<br>e jogue o BioQuest!
  </div>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script src="game_novo.js"></script>

</body>
</html>
